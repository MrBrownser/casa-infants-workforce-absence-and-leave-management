# Nightly encrypted backup of the production database.
#
# Copy to .github/workflows/backup.yml in a separate PRIVATE repository (never
# this public one: workflow artifacts of a public repository can be downloaded by
# anyone signed in to GitHub). In that repository set:
#   - secret   BACKUP_DATABASE_URL: production session pooler URL (Supabase, :5432)
#   - variable BACKUP_AGE_RECIPIENT: age public key (age1...); keep the private
#     key offline (password manager), it is the only way to read a backup
# GitHub emails the repository owner when a scheduled run fails.
name: Nightly backup

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC, off the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the backup script (public app repository)
        uses: actions/checkout@v5
        with:
          repository: MrBrownser/casa-infants-workforce-absence-and-leave-management
          sparse-checkout: scripts/backup

      # pg_dump must be at least the server's major version (check it in Supabase,
      # Settings, Infrastructure) and age encrypts the dump.
      - name: Install PostgreSQL 17 client and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-17 age

      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          PG_BIN: /usr/lib/postgresql/17/bin
        run: scripts/backup/backup.sh "$RUNNER_TEMP"

      - name: Keep 30 days of backups
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: ${{ runner.temp }}/*.dump.age
          retention-days: 30
          if-no-files-found: error
